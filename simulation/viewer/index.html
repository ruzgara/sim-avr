<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AVR circuit viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      font-family: system-ui, sans-serif;
      background-color: #e6e9ec;
      /* faint dot grid, like the Wokwi canvas */
      background-image: radial-gradient(#c3c8cd 1px, transparent 1px);
      background-size: 20px 20px;
    }
    #viewport { position: absolute; inset: 0; cursor: grab; touch-action: none; }
    #viewport.dragging { cursor: grabbing; }
    /* #stage holds parts + wires in diagram coordinates; viewer.js sets its transform */
    #stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
    #stage > * { position: absolute; }
    #wires { left: 0; top: 0; width: 1px; height: 1px; overflow: visible; pointer-events: none; }
    #wires polyline { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    #badge {
      position: fixed; top: 10px; right: 10px; padding: 4px 10px; border-radius: 12px;
      font-size: 13px; color: #fff; background: #777; user-select: none;
    }
    #badge.running { background: #2e9e44; }
    #badge.stopped { background: #d98a00; }
    #badge.ended { background: #555; }
    #badge.disconnected { background: #c0392b; }
    #msg { position: fixed; left: 10px; bottom: 10px; color: #a00; font-size: 13px; }
  </style>
</head>
<body>
  <div id="viewport"><div id="stage"><svg id="wires"></svg></div></div>
  <div id="badge">connecting...</div>
  <div id="msg"></div>
  <!-- Wokwi web components (defines <wokwi-led>, <wokwi-arduino-nano>, ...) -->
  <script src="vendor/wokwi-elements.bundle.min.js"></script>
  <script type="module" src="viewer.js"></script>
</body>
</html>
